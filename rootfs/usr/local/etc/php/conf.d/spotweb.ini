memory_limit = 512M
upload_max_filesize = 32M
post_max_size = 32M
max_execution_time = 300
expose_php = Off

; PHP's default is to print errors into the page. Spotweb's dependencies raise
; PHP 8.4+ deprecation notices on every request, which end up in the HTML and
; break JSON responses. Send errors to the log instead, without deprecations.
display_errors = Off
display_startup_errors = Off
log_errors = On
error_reporting = E_ALL & ~E_DEPRECATED

; Mitigation for PHP2Shell (CVE-2026-109618 / CVE-2026-109619), reported to sit
; in the session upload progress handler. Spotweb does not use upload progress.
session.upload_progress.enabled = Off
