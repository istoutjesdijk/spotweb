memory_limit = 512M
upload_max_filesize = 32M
post_max_size = 32M
max_execution_time = 300
expose_php = Off

; Mitigation for PHP2Shell (CVE-2026-109618 / CVE-2026-109619), reported to sit
; in the session upload progress handler. Spotweb does not use upload progress.
session.upload_progress.enabled = Off
