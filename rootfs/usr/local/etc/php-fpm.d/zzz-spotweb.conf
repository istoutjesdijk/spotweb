; Loaded after www.conf and zz-docker.conf, so these values win.
;
; The stock pool allows 5 workers. That is too few for Spotweb: a spot page
; fires dozens of ?page=getimage requests (one per commenter avatar) plus image
; and NZB fetches that wait on the Usenet server, all through PHP. Once those
; fill the 5 slots, a search or page load queues behind them. Workers use about
; 20 MB each, so 20 of them stay well under half a gigabyte.
[www]
pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6
pm.max_requests = 500
