# Scheme the browser used, as reported by the reverse proxy in front of this
# container. Spotweb builds absolute URLs from it, including the <base href> of
# every page, so getting it wrong makes an https page load http assets.
#
# The entrypoint overwrites this file when SPOTWEB_FORCE_HTTPS is set, for
# proxies that terminate TLS but still forward X-Forwarded-Proto: http.
map $http_x_forwarded_proto $spotweb_proto {
    default  $scheme;
    https    https;
    http     http;
}

map $spotweb_proto $spotweb_https {
    default  '';
    https    on;
}
