name: build

# Work lands on develop. A green build there publishes the image and only then
# fast-forwards main to the same commit. Coolify deploys main, so it never sees
# a commit before its image exists and never sees a commit that failed the
# smoke test.
on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
  workflow_dispatch:

# Builds of one branch run one after another instead of side by side, so an
# older build can never finish last and leave :latest behind the commit that
# main points at. Superseded pull request builds are still cancelled.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Read pinned upstream ref
        id: ref
        run: |
          full="$(cat .upstream-ref)"
          echo "full=$full" >> "$GITHUB_OUTPUT"
          echo "short=$(printf '%s' "$full" | cut -c1-12)" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image for testing
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: spotweb:test
          build-args: |
            SPOTWEB_REF=${{ steps.ref.outputs.full }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        env:
          SPOTWEB_IMAGE: spotweb:test
        run: ./test/smoke.sh

  publish:
    needs: build-test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    env:
      DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history, so main can be fast-forwarded from this checkout.
          fetch-depth: 0

      - name: Read pinned upstream ref
        id: ref
        run: |
          full="$(cat .upstream-ref)"
          echo "full=$full" >> "$GITHUB_OUTPUT"
          echo "short=$(printf '%s' "$full" | cut -c1-12)" >> "$GITHUB_OUTPUT"

      # Always publish to GHCR. Add Docker Hub only when both the DOCKERHUB_USERNAME
      # variable and the DOCKERHUB_TOKEN secret are set, so a missing or half-finished
      # Docker Hub setup never fails the build; it just publishes to GHCR.
      - name: Assemble image list
        id: images
        run: |
          {
            echo "list<<EOF"
            echo "ghcr.io/${{ github.repository_owner }}/spotweb"
            if [ -n "$DOCKERHUB_USERNAME" ] && [ -n "$DOCKERHUB_TOKEN" ]; then
              echo "docker.io/${DOCKERHUB_USERNAME}/spotweb"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.images.outputs.list }}
          tags: |
            type=raw,value=latest
            type=raw,value=sha-${{ steps.ref.outputs.short }}
            type=raw,value={{date 'YYYYMMDD'}}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: ${{ env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != '' }}
        uses: docker/login-action@v4
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Build and push (amd64, arm64)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          # Publish a plain multi-arch index (amd64 + arm64) with no build
          # attestations. Buildx adds provenance/SBOM manifests as extra
          # "unknown/unknown" entries in the image index by default, and
          # "docker compose pull" (as used by Coolify) chokes on them with
          # "content digest ... not found". Disabling them keeps the image
          # pullable everywhere.
          provenance: false
          sbom: false
          build-args: |
            SPOTWEB_REF=${{ steps.ref.outputs.full }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The image is published, so main may now point at this commit; that push
      # is what makes Coolify deploy. Fast-forward only: if main has commits
      # develop lacks, this fails rather than overwrite them.
      #
      # GitHub refuses a GITHUB_TOKEN push that changes files under
      # .github/workflows/, even as a fast-forward. When develop carries such a
      # change, this step fails and main has to be moved by hand:
      #   git push origin develop:main
      - name: Promote to main
        if: github.ref == 'refs/heads/develop'
        run: git push origin "${GITHUB_SHA}:refs/heads/main"

  notify-failure:
    needs: [build-test, publish]
    if: failure() && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `The build workflow failed for commit ${context.sha}.\n\nRun: ${runUrl}\n\nIf only the "Promote to main" step failed, the image is published but main was not moved. That happens when the commit changes workflow files; run \`git push origin develop:main\` to deploy it.`;
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: "ci-failure",
            });
            if (existing.data.length === 0) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: "CI build failed",
                body,
                labels: ["ci-failure"],
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.data[0].number,
                body,
              });
            }
